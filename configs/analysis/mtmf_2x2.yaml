# The MTMF 2x2: one comprehensive-analysis battery, run identically on four models.
#
# Why this file exists
# --------------------
# The five paper analyses were only ever run per-experiment, with each model
# resolving its own best epoch and pooling both validation splits. Two models
# analysed that way are NOT comparable: they are read at different checkpoints,
# over different mixtures of two generalization regimes. This config pins every
# setting that has to be identical across the four cells so the outputs can be
# put side by side.
#
# Run it with:
#   ./run_mtmf_2x2.sh                 # accuracy-matched design (default)
#   ./run_mtmf_2x2.sh ceiling         # each model at its own best epoch
#   ./run_mtmf_2x2.sh both
#
# Do not hand-assemble the CLI. Every flag below exists because omitting it
# silently produced an incomparable result at least once.

# --- Settings held identical across all four cells -----------------------------
split: val_novel_identity     # never pool: novel identities are unseen in this
                              # split and seen in val_novel_angle, so identity
                              # decodability is not the same quantity in each.
property: identity            # the property Analysis 4 and 5 decode
analysis: all                 # all five paper analyses
best_epoch_by: val_novel_identity_acc

# --- The four cells of the 2x2 -------------------------------------------------
# `experiment` is a prefix; the newest matching directory under experiments/ is
# resolved at run time.
#
# epoch_matched: the accuracy-matched pins from docs/NEURAL_EFFICIENCY.md, the
#   same checkpoints the neural-efficiency chapter reads. Matched WITHIN each
#   row of the 2x2 (see the accuracy note on each cell).
# epoch_ceiling: each model's own best val_novel_identity_acc checkpoint.
#
# Accuracies below were read from training_log.json on hamrah-gpu-internal and
# re-verified there on 2026-09-02:
#   baseline        ep17 id=82.53 (best ep17 82.53)
#   attention       ep9  id=81.65 (best ep18 91.91)
#   baseline_proxy  ep20 id=93.55 (best ep20 93.55)
#   attention_proxy ep45 id=93.55 (best ep4  93.63)
cells:
  - label: baseline
    arm: [scratch, baseline]
    experiment: wm_mtmf
    epoch_matched: 17
    epoch_ceiling: 17
    accuracy_matched: 82.53

  - label: attention
    arm: [scratch, attention]
    experiment: wm_attention_mtmf
    epoch_matched: 9          # matched to baseline@17 -> 0.88pp gap (81.65 vs 82.53)
    epoch_ceiling: 18         # its own best: 91.91
    accuracy_matched: 81.65

  - label: baseline_proxy
    arm: [proxy, baseline]
    experiment: finetune_proxy_wm_mtmf
    epoch_matched: 20
    epoch_ceiling: 20
    accuracy_matched: 93.55

  - label: attention_proxy
    arm: [proxy, attention]
    experiment: finetune_proxy_wm_attention_mtmf
    epoch_matched: 45         # matched to baseline_proxy@20 -> 0.00pp gap (93.55 vs 93.55)
    epoch_ceiling: 4          # its own best: 93.63 -- it converges almost immediately
    accuracy_matched: 93.55

# --- Known limits of this design, carried with the results ---------------------
caveats:
  - "The scratch row is matched at 0.88pp and the proxy row at 0.00pp, but the
     two ROWS are ~11pp apart. Proxy epoch 1 already exceeds every baseline
     checkpoint on this split, so no accuracy-matched baseline-vs-proxy pair
     exists. Compare freely WITHIN a row; across rows, any difference is
     confounded with accuracy."
  - "h=256 sampling: n_test is roughly 52 against ~70 identity classes. Identity
     decoding accuracies are unreliable in absolute terms; the analysis reports
     chance level and a normalised score alongside every raw accuracy."
  - "One seed per cell. Differences between cells are observed, not measured."
